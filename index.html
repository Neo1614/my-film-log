<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE CINEMATIC ARCHIVE | Art Deco Film Log</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ART DECO SPECIFIC STYLING */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Marcellus&display=swap');

    :root {
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --deco-black: #08080a;
      --deco-surface: #121216;
    }

    body {
      background-color: var(--deco-black);
      color: #e4e4e7;
      font-family: 'Marcellus', serif;
      /* Subtle Art Deco Fan Geometric Pattern */
      background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 80%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 L60 30 L30 60 L0 30 Z' fill='none' stroke='%23d4af37' stroke-opacity='0.08' stroke-width='1'/%3E%3C/svg%3E");
      background-attachment: fixed;
    }

    h1, h2, h3, h4, .deco-title {
      font-family: 'Cinzel', serif;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* Metallic Gold Text Effect */
    .gold-gradient-text {
      background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Geometric Art Deco Card Frames */
    .deco-card {
      background: var(--deco-surface);
      border: 1px solid var(--gold-primary);
      position: relative;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.05);
    }

    /* Double Line Border Framing Effect */
    .deco-card::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      pointer-events: none;
    }

    /* Stepped Geometric Corner Accents */
    .deco-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--gold-primary);
      z-index: 10;
    }
    .top-left { top: -2px; left: -2px; border-top: 3px solid; border-left: 3px solid; }
    .top-right { top: -2px; right: -2px; border-top: 3px solid; border-right: 3px solid; }
    .bottom-left { bottom: -2px; left: -2px; border-bottom: 3px solid; border-left: 3px solid; }
    .bottom-right { bottom: -2px; right: -2px; border-bottom: 3px solid; border-right: 3px solid; }

    /* Art Deco Inputs */
    input, textarea {
      background: rgba(8, 8, 10, 0.8) !important;
      border: 1px solid rgba(212, 175, 55, 0.4) !important;
      color: #f3e5ab !important;
      transition: all 0.3s ease;
      font-family: 'Marcellus', serif;
    }

    input:focus, textarea:focus {
      outline: none !important;
      border-color: var(--gold-primary) !important;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3) !important;
    }

    /* Deco Button */
    .deco-btn {
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.15) 0%, rgba(8, 8, 10, 0.9) 100%);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      letter-spacing: 0.2em;
      transition: all 0.3s ease;
      position: relative;
    }

    .deco-btn:hover {
      background: var(--gold-primary);
      color: var(--deco-black);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
      font-weight: bold;
    }

    /* Star Rating */
    .star-rating button {
      transition: all 0.2s ease;
      color: rgba(212, 175, 55, 0.2);
    }
    .star-rating button:hover, .star-rating button.active {
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
    }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- Art Deco Central Header Banner -->
  <header class="pt-16 pb-12 px-4 text-center border-b border-yellow-600/30 relative">
    
    <!-- Top Geometric Line Art Motif -->
    <div class="flex items-center justify-center gap-4 mb-4 text-yellow-600/60">
      <div class="h-px w-16 bg-gradient-to-r from-transparent to-yellow-600"></div>
      <span class="text-xl">◆</span>
      <div class="h-2 w-2 rotate-45 border border-yellow-600"></div>
      <span class="text-xl">◆</span>
      <div class="h-px w-16 bg-gradient-to-l from-transparent to-yellow-600"></div>
    </div>

    <!-- MAIN TITLE FRONT & CENTER -->
    <div class="inline-block relative px-8 py-4">
      <p class="text-xs tracking-[0.4em] uppercase text-yellow-500/70 mb-2">Private Viewing Gazette</p>
      <h1 class="text-4xl md:text-6xl font-black gold-gradient-text tracking-[0.25em] py-2">
        THE CINEMATIC LOG
      </h1>
      <p class="text-sm tracking-[0.2em] text-zinc-400 mt-2 italic">EST. MCMXXVI</p>
    </div>

    <!-- Bottom Motif Fan -->
    <div class="flex items-center justify-center gap-2 mt-4 text-yellow-600/60">
      <div class="h-px w-32 bg-gradient-to-r from-transparent via-yellow-600 to-transparent"></div>
    </div>
  </header>

  <!-- Main App Interface -->
  <main class="max-w-6xl mx-auto px-6 pt-12 grid grid-cols-1 lg:grid-cols-12 gap-10">

    <!-- Sidebar / Logging Form (Art Deco Styled) -->
    <section class="lg:col-span-4">
      <div class="deco-card p-6 rounded-none sticky top-8">
        <!-- Corner Steps -->
        <div class="deco-corner top-left"></div>
        <div class="deco-corner top-right"></div>
        <div class="deco-corner bottom-left"></div>
        <div class="deco-corner bottom-right"></div>

        <h2 class="text-xl font-bold text-center gold-gradient-text mb-6 pb-3 border-b border-yellow-600/30">
          Inscribe Entry
        </h2>

        <form id="movieForm" class="flex flex-col gap-5">
          <div>
            <label class="block text-xs uppercase tracking-[0.2em] text-yellow-500/80 mb-2">Film Title</label>
            <input type="text" id="movieTitle" required placeholder="e.g. Metropolis" class="w-full px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-[0.2em] text-yellow-500/80 mb-2">Poster URL</label>
            <input type="url" id="moviePoster" placeholder="https://..." class="w-full px-3 py-2 text-sm">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-[0.2em] text-yellow-500/80 mb-2">Rating</label>
            <div id="starInput" class="star-rating flex gap-2 text-2xl">
              <button type="button" data-value="1">★</button>
              <button type="button" data-value="2">★</button>
              <button type="button" data-value="3">★</button>
              <button type="button" data-value="4">★</button>
              <button type="button" data-value="5">★</button>
            </div>
            <input type="hidden" id="selectedRating" value="5">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-[0.2em] text-yellow-500/80 mb-2">Critique</label>
            <textarea id="movieReview" rows="4" required placeholder="Write your assessment..." class="w-full px-3 py-2 text-sm"></textarea>
          </div>

          <button type="submit" class="deco-btn py-3 mt-2 text-xs uppercase font-bold">
            Add To Archive
          </button>
        </form>
      </div>
    </section>

    <!-- Main Feed / Movie List -->
    <section class="lg:col-span-8 flex flex-col gap-8" id="reviewsContainer">
      <!-- Art Deco Review Cards dynamically injected here -->
    </section>

  </main>

  <script>
    // Sample initial Art Deco Entry
    const sampleReviews = [
      {
        id: 1,
        title: "THE GREAT GATSBY",
        poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop",
        rating: 5,
        review: "A breathtaking visual spectacle bathed in opulence, tragic romance, and dazzling jazz-age grandiosity. Every frame captures the roaring splendor of the era.",
        comments: [
          { name: "DAISY", text: "Truly dazzling. A masterpiece of production design." }
        ]
      }
    ];

    let currentRating = 5;

    // Handle Star Rating Click Behavior
    const starButtons = document.querySelectorAll('#starInput button');
    starButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentRating = parseInt(btn.dataset.value);
        document.getElementById('selectedRating').value = currentRating;
        updateStarUI(currentRating);
      });
    });

    function updateStarUI(rating) {
      starButtons.forEach((btn, idx) => {
        if (idx < rating) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
    updateStarUI(5);

    // Render Movie Reviews Feed
    function renderReviews() {
      const container = document.getElementById('reviewsContainer');
      container.innerHTML = '';

      sampleReviews.forEach(item => {
        const starsHtml = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
        const posterUrl = item.poster || 'https://via.placeholder.com/300x450/08080a/d4af37?text=NO+IMAGE';

        const card = document.createElement('article');
        card.className = "deco-card p-6 grid grid-cols-1 sm:grid-cols-12 gap-6 relative";
        
        card.innerHTML = `
          <!-- Corner Steps -->
          <div class="deco-corner top-left"></div>
          <div class="deco-corner top-right"></div>
          <div class="deco-corner bottom-left"></div>
          <div class="deco-corner bottom-right"></div>

          <!-- Poster Column -->
          <div class="sm:col-span-4 border border-yellow-600/40 p-1 bg-black/60">
            <img src="${posterUrl}" alt="${item.title}" class="w-full h-full object-cover">
          </div>

          <!-- Content Column -->
          <div class="sm:col-span-8 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between border-b border-yellow-600/30 pb-3 mb-3">
                <h3 class="text-xl font-bold gold-gradient-text tracking-widest">${item.title}</h3>
                <span class="text-yellow-500 font-bold tracking-widest text-lg">${starsHtml}</span>
              </div>
              <p class="text-zinc-300 text-sm leading-relaxed mb-6">${item.review}</p>
            </div>

            <!-- Comment Section -->
            <div class="border-t border-yellow-600/30 pt-4">
              <h4 class="text-xs uppercase tracking-[0.2em] text-yellow-500/80 mb-3">Discourse (${item.comments.length})</h4>
              
              <!-- Existing Comments -->
              <div class="space-y-2 mb-4 max-h-36 overflow-y-auto pr-1">
                ${item.comments.map(c => `
                  <div class="bg-black/50 border-l-2 border-yellow-600 p-2 text-xs">
                    <span class="font-bold text-yellow-500 tracking-wider">${c.name}:</span> 
                    <span class="text-zinc-300">${c.text}</span>
                  </div>
                `).join('')}
              </div>

              <!-- Add Comment Form -->
              <form onsubmit="addComment(event, ${item.id})" class="flex gap-2">
                <input type="text" placeholder="NAME" required class="comment-name w-1/3 px-2 py-1 text-xs uppercase">
                <input type="text" placeholder="ADD COMMENT..." required class="comment-text w-2/3 px-2 py-1 text-xs">
                <button type="submit" class="deco-btn px-3 py-1 text-[10px] uppercase">Post</button>
              </form>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Handle Form Submit
    document.getElementById('movieForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('movieTitle').value.toUpperCase();
      const poster = document.getElementById('moviePoster').value;
      const rating = parseInt(document.getElementById('selectedRating').value);
      const review = document.getElementById('movieReview').value;

      sampleReviews.unshift({
        id: Date.now(),
        title,
        poster,
        rating,
        review,
        comments: []
      });

      renderReviews();
      e.target.reset();
      updateStarUI(5);
    });

    // Handle Comments
    function addComment(e, movieId) {
      e.preventDefault();
      const form = e.target;
      const name = form.querySelector('.comment-name').value.toUpperCase();
      const text = form.querySelector('.comment-text').value;

      const movie = sampleReviews.find(m => m.id === movieId);
      if (movie) {
        movie.comments.push({ name, text });
        renderReviews();
      }
    }

    renderReviews();
  </script>
</body>
</html>
