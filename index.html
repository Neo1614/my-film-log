<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Film Log</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar and star glow styles */
    .star-rating button:hover,
    .star-rating button.active {
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased pb-20">

  <!-- Header -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🎬</span>
        <h1 class="text-xl font-bold tracking-tight text-amber-500">FILM LOG</h1>
      </div>
      <p class="text-sm text-zinc-400">Personal Reviews & Discussions</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 pt-8 grid grid-cols-1 md:grid-cols-3 gap-8">

    <!-- Sidebar / Add Review Form -->
    <section class="md:col-span-1">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 sticky top-24 shadow-xl">
        <h2 class="text-lg font-semibold mb-4 text-zinc-200 border-b border-zinc-800 pb-2">Log a Movie</h2>
        
        <form id="movieForm" class="flex flex-col gap-4">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">MOVIE TITLE</label>
            <input type="text" id="movieTitle" required placeholder="e.g. Dune: Part Two" 
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">POSTER IMAGE URL</label>
            <input type="url" id="moviePoster" placeholder="https://image-url.jpg (optional)" 
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">YOUR RATING</label>
            <div id="starInput" class="star-rating flex gap-1 text-2xl text-zinc-600">
              <button type="button" data-value="1">★</button>
              <button type="button" data-value="2">★</button>
              <button type="button" data-value="3">★</button>
              <button type="button" data-value="4">★</button>
              <button type="button" data-value="5">★</button>
            </div>
            <input type="hidden" id="selectedRating" value="5">
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">YOUR REVIEW</label>
            <textarea id="movieReview" rows="4" required placeholder="What did you think of the film?" 
              class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500 transition"></textarea>
          </div>

          <button type="submit" 
            class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-amber-500/10">
            Publish Review
          </button>
        </form>
      </div>
    </section>

    <!-- Main Feed / Movie Reviews -->
    <section class="md:col-span-2 flex flex-col gap-6" id="reviewsContainer">
      <!-- Reviews will dynamically render here -->
    </section>

  </main>

  <script>
    // Initial sample data so the page isn't empty on load
    const sampleReviews = [
      {
        id: 1,
        title: "Interstellar",
        poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&auto=format&fit=crop&q=80",
        rating: 5,
        review: "A breathtaking masterpiece about love, time, and human survival. Hans Zimmer's soundtrack elevates every single scene to unimaginable heights.",
        comments: [
          { name: "Alex", text: "That docking scene still gives me goosebumps every time!" },
          { name: "Sarah", text: "100% agree on the score. Best sci-fi movie of the decade." }
        ]
      }
    ];

    let currentRating = 5;

    // Handle Star Rating Click Behavior
    const starButtons = document.querySelectorAll('#starInput button');
    starButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentRating = parseInt(btn.dataset.value);
        document.getElementById('selectedRating').value = currentRating;
        updateStarUI(currentRating);
      });
    });

    function updateStarUI(rating) {
      starButtons.forEach((btn, idx) => {
        if (idx < rating) {
          btn.classList.add('text-amber-500', 'active');
          btn.classList.remove('text-zinc-600');
        } else {
          btn.classList.remove('text-amber-500', 'active');
          btn.classList.add('text-zinc-600');
        }
      });
    }
    // Initialize stars to 5 by default
    updateStarUI(5);

    // Render Movie Reviews Feed
    function renderReviews() {
      const container = document.getElementById('reviewsContainer');
      container.innerHTML = '';

      sampleReviews.forEach(item => {
        const starsHtml = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
        const posterUrl = item.poster || 'https://via.placeholder.com/300x450/18181b/a1a1aa?text=No+Poster';

        const card = document.createElement('article');
        card.className = "bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-xl flex flex-col sm:flex-row";
        
        card.innerHTML = `
          <!-- Poster -->
          <div class="sm:w-1/3 bg-zinc-950 flex items-center justify-center border-b sm:border-b-0 sm:border-r border-zinc-800 min-h-[220px]">
            <img src="${posterUrl}" alt="${item.title}" class="w-full h-full object-cover max-h-[320px]">
          </div>

          <!-- Content -->
          <div class="sm:w-2/3 p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between mb-2">
                <h3 class="text-xl font-bold text-zinc-100">${item.title}</h3>
                <span class="text-amber-500 font-bold tracking-widest text-lg">${starsHtml}</span>
              </div>
              <p class="text-zinc-300 text-sm leading-relaxed mb-6">${item.review}</p>
            </div>

            <!-- Comment Section -->
            <div class="border-t border-zinc-800/80 pt-4">
              <h4 class="text-xs font-semibold text-zinc-400 mb-3 tracking-wider uppercase">Discussion (${item.comments.length})</h4>
              
              <!-- Existing Comments -->
              <div class="space-y-2 mb-4 max-h-36 overflow-y-auto pr-1">
                ${item.comments.map(c => `
                  <div class="bg-zinc-950/60 p-2.5 rounded-lg border border-zinc-800/60 text-xs">
                    <span class="font-bold text-amber-500/90">${c.name}:</span> 
                    <span class="text-zinc-300">${c.text}</span>
                  </div>
                `).join('')}
              </div>

              <!-- Add Comment Input -->
              <form onsubmit="addComment(event, ${item.id})" class="flex gap-2">
                <input type="text" placeholder="Your Name" required class="comment-name w-1/3 bg-zinc-800 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                <input type="text" placeholder="Leave a comment..." required class="comment-text w-2/3 bg-zinc-800 border border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 font-medium transition">Post</button>
              </form>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Handle Adding a New Movie Review
    document.getElementById('movieForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('movieTitle').value;
      const poster = document.getElementById('moviePoster').value;
      const rating = parseInt(document.getElementById('selectedRating').value);
      const review = document.getElementById('movieReview').value;

      const newReview = {
        id: Date.now(),
        title,
        poster,
        rating,
        review,
        comments: []
      };

      sampleReviews.unshift(newReview);
      renderReviews();

      // Reset Form
      e.target.reset();
      updateStarUI(5);
    });

    // Handle Adding a Visitor Comment
    function addComment(e, movieId) {
      e.preventDefault();
      const form = e.target;
      const name = form.querySelector('.comment-name').value;
      const text = form.querySelector('.comment-text').value;

      const movie = sampleReviews.find(m => m.id === movieId);
      if (movie) {
        movie.comments.push({ name, text });
        renderReviews();
      }
    }

    // Initial Render
    renderReviews();
  </script>
</body>
</html>
